name: Verify and deploy Astrology Workbench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests only receive read access. Deployment privileges belong to the
# separate job, which cannot run for a pull request or a non-main dispatch.
permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MCP dependencies
        working-directory: mcp
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - name: Verify real MCP transports and shared tools
        run: |
          node scripts/tests/mcp-toolkit.mjs
          npm test --prefix mcp
      - name: Keep MCP lock and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-evidence
          path: mcp/package-lock.json
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculation and source checks
        run: |
          node scripts/engine-test.mjs
          node scripts/audit.mjs
          node scripts/round-ledger.mjs --check
      - name: Install browser test tooling
        # A test-only pinned dependency; never copied into the static artifact.
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser journeys under the Pages project path
        run: node scripts/browser-release.mjs
      - name: Fetch pinned SkyLens integration fixture
        env:
          SKY_REVISION: 2b2aa089009db3ddedc2256a7a5456b402b23962
          SKY_LENS_ROOT: ${{ runner.temp }}/skylens-session
        run: |
          git init "$SKY_LENS_ROOT"
          git -C "$SKY_LENS_ROOT" remote add origin https://github.com/occult-kranti/skylens.git
          git -C "$SKY_LENS_ROOT" fetch --depth=1 origin "$SKY_REVISION"
          git -C "$SKY_LENS_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$SKY_LENS_ROOT" rev-parse HEAD)" = "$SKY_REVISION"
      - name: Verify observing sessions and explicit AI disclosure
        env:
          SKY_LENS_ROOT: ${{ runner.temp }}/skylens-session
        run: |
          node scripts/check-sky-handoff.mjs
          node scripts/browser-sessions.mjs
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stage tracked static files and release identity
        # git archive excludes ephemeral dependencies and local untracked files.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          node --input-type=module <<'NODE'
          import { writeFileSync, rmSync } from 'node:fs';
          for (const path of ['.github', 'tests', 'scripts', 'tools', 'test-results', 'node_modules', 'mcp']) {
            rmSync('_site/' + path, { recursive: true, force: true });
          }
          writeFileSync('_site/.nojekyll', '');
          writeFileSync('_site/release.json', JSON.stringify({
            commit: process.env.RELEASE_SHA,
            generatedAt: new Date().toISOString(),
            validation: 'node-and-playwright',
          }, null, 2) + '\n');
          NODE
      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [verify, mcp]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use verified workflow artifacts for Pages
        # This job explicitly has pages:write. The external GitHub integration
        # can inspect this setting but cannot update it (403).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.PAGE_URL);
          if (base.protocol !== 'https:') throw new Error('Pages must use HTTPS for camera and sensors.');
          let verified = false;
          for (let attempt = 0; attempt < 15; attempt++) {
            try {
              const metadata = new URL('release.json', base);
              metadata.searchParams.set('release', process.env.RELEASE_SHA);
              const response = await fetch(metadata, { signal: AbortSignal.timeout(10000) });
              const release = await response.json();
              if (response.ok && release.commit === process.env.RELEASE_SHA) {
                const home = await fetch(base, { signal: AbortSignal.timeout(10000) });
                if (!home.ok) throw new Error('Published homepage is unavailable.');
                const studio = await fetch(new URL('pages/studio.html', base), { signal: AbortSignal.timeout(10000) });
                const studioHTML = await studio.text();
                if (!studio.ok || !studioHTML.includes('Live Symbol Studio') || !studioHTML.includes('sessionJournal')) throw new Error('Published Studio/session journal is unavailable.');
                const setup = await fetch(new URL('pages/mcp.html', base), { signal: AbortSignal.timeout(10000) });
                if (!setup.ok || !(await setup.text()).includes('Connect MCP')) throw new Error('Published MCP connection page is unavailable.');
                const catalogueResponse = await fetch(new URL('assets/data/mcp-catalogue.json', base), { signal: AbortSignal.timeout(10000) });
                const catalogue = await catalogueResponse.json();
                if (!catalogueResponse.ok || catalogue.staticPageIsMcpServer !== false || catalogue.tools?.length !== 11) throw new Error('Published MCP catalogue is missing or invalid.');
                verified = true;
                console.log('Verified Pages release ' + release.commit + ' at ' + base.href);
                break;
              }
            } catch (error) { console.log('Waiting for Pages publication: ' + error.message); }
            await new Promise(resolve => setTimeout(resolve, 4000));
          }
          if (!verified) throw new Error('Published release identity did not match the tested commit.');
          NODE
