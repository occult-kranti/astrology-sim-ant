name: Verify and deploy Astrology Workbench

on:
  push:
    branches: [main, feat/desktop-astrology-workbench]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_feature_branch:
        description: 'Deploy the desktop branch only after its Pages environment permission is configured'
        required: false
        type: boolean
        default: false

# Pull requests only receive read access. Deployment privileges belong to the
# separate job, which cannot run for a pull request or an unlisted branch.
permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned MCP dependencies
        working-directory: mcp
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - name: Verify real MCP transports and shared tools
        run: |
          node scripts/tests/mcp-toolkit.mjs
          node scripts/test-horizon-protocol.mjs
          node scripts/test-country-history-protocol.mjs
          node scripts/test-calendar-timeline-protocol.mjs
          node scripts/test-newton-chronology-protocol.mjs
          node scripts/test-eschatology-atlas-protocol.mjs
          node scripts/test-workbench-rag-protocol.mjs
          node scripts/test-reading-lab-protocol.mjs
          node scripts/test-astrocartography-protocol.mjs
          npm test --prefix mcp
      - name: Keep MCP lock and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-evidence
          path: mcp/package-lock.json
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Python for standard-library evaluation checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculation and source checks
        env:
          NEWTON_SEMANTIC_RECEIPT: test-results/newton-chronology-semantic.json
          ESCHATOLOGY_SEMANTIC_RECEIPT: test-results/eschatology-atlas-semantic.json
        run: |
          node scripts/engine-test.mjs
          node scripts/tests/desktop-workbench.mjs
          node scripts/tests/desktop-library.mjs
          node scripts/tests/reading-lab.mjs
          node scripts/tests/astrocartography.mjs
          node scripts/tests/astrocartography-independent.mjs
          node scripts/tests/workbench-chat-actions.mjs
          node scripts/tests/workbench-rag.mjs
          node scripts/build-workbench-rag.mjs --check
          node scripts/build-reading-lab-database.mjs --check
          node scripts/audit.mjs
          node scripts/round-ledger.mjs --check
          node scripts/build-offline-manifest.mjs --check
      - name: Model fixture provenance and answer-evaluator regression checks
        # Fixture arithmetic and stdlib-only scoring tests. No training, model
        # download, sealed-data access, live authentication or inference in CI.
        run: |
          mkdir -p test-results/model-lab
          node scripts/tests/model-lab-fixtures.mjs > test-results/model-lab/fixture-integrity.json
          python3 local-rag/model-lab/test-evaluator.py > test-results/model-lab/evaluator-regression.json
          python3 -m py_compile local-rag/model-lab/*.py
      - name: Install pinned optional companion test dependencies
        run: npm ci --prefix local-rag --ignore-scripts
      - name: Local RAG HTTP boundaries and SIWC cryptographic contracts
        # Mock providers and generated test identity keys only. No model download,
        # paid inference, live OAuth session or provider credential is used in CI.
        run: |
          node scripts/tests/local-rag-server.mjs
          node scripts/tests/chatgpt-login.mjs
      - name: Install browser test tooling
        # A test-only pinned dependency; never copied into the static artifact.
        run: npm install --no-save --package-lock=false playwright@1.58.2 puppeteer-core@24.37.2 esbuild@0.25.11 parse5@7.3.0 @electric-sql/pglite@0.5.13
      - name: Public RAG schema, retrieval and database role boundaries
        env:
          PGLITE_PKG: node_modules/@electric-sql/pglite/dist/index.js
          WORKBENCH_DB_RECEIPT: test-results/workbench-rag-db/receipt.json
        run: node scripts/test-workbench-rag-db.mjs
      - name: Public reading examples, invoker RPC and database role boundaries
        env:
          PGLITE_PKG: node_modules/@electric-sql/pglite/dist/index.js
          READING_LAB_DB_RECEIPT: test-results/reading-lab-db/receipt.json
        run: node scripts/test-reading-lab-db.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and verify the direct-open standalone desktop edition
        env:
          DESKTOP_STANDALONE_HTML: test-results/desktop-standalone-build/desktop-chart-studio.html
          DESKTOP_STANDALONE_OUTPUT: test-results/desktop-standalone
        run: |
          node scripts/build-desktop-standalone.mjs --tools node_modules --out test-results/desktop-standalone-build
          node scripts/browser-desktop-standalone.mjs
      - name: Desktop chart workspace, library, exports and interaction stress
        env:
          DESKTOP_OUTPUT: test-results/desktop-workbench
        run: node scripts/browser-desktop-workbench.mjs
      - name: Source retrieval, reviewed chatbot actions and mock-provider browser flows
        env:
          WORKBENCH_CHAT_OUTPUT: test-results/workbench-chat
          WORKBENCH_CHAT_STANDALONE_HTML: test-results/desktop-standalone-build/desktop-chart-studio.html
        run: node scripts/browser-workbench-chat.mjs
      - name: Reading Lab source examples, date precision, reviewed context and accessible comparisons
        env:
          READING_LAB_OUTPUT: test-results/reading-lab
        run: node scripts/browser-reading-lab.mjs
      - name: Astrocartography geometry, map interaction, place comparison and offline behavior
        env:
          ASTROCARTOGRAPHY_OUTPUT: test-results/astrocartography
        run: node scripts/browser-astrocartography.mjs
      - name: Orbital frames, eclipse timeline and named source readings
        env:
          ORBITAL_OUTPUT: test-results/orbital-space
        run: node scripts/browser-orbital-space.mjs
      - name: Chart relationships, stable calendar colors and bounded interaction stress
        env:
          RELATION_OUTPUT: test-results/chart-relationships
        run: node scripts/browser-chart-relationships.mjs
      - name: Black chart paints, relationship controls and standalone SVGs
        env:
          BLACK_CHART_OUTPUT: test-results/black-charts
        run: node scripts/browser-black-charts.mjs
      - name: Chart console, image exports and verified offline library
        env:
          BIRTH_CONSOLE_OUTPUT: test-results/birth-console
        run: node scripts/browser-birth-console.mjs
      - name: Browser journeys under the Pages project path
        # Separate browser lifetimes retain every journey and page assertion.
        # A long-lived local all-mode run exhausted tab creation after a redirect
        # failure; all six isolated phases passed on the corrected candidate.
        run: |
          set -euo pipefail
          for browser_phase in calculators workbench studio connections assistant pages; do
            BROWSER_PHASE="$browser_phase" BROWSER_OUTPUT="test-results/$browser_phase" node scripts/browser-release.mjs
          done
      - name: Mobile observatory, weekly refresh and comparison journeys
        env:
          OBS_OUTPUT: test-results/observatory
        run: node scripts/browser-observatory.mjs
      - name: Sigils, explainable hours, standards and world events
        env:
          EXPANSION_OUTPUT: test-results/studio-expansion
        run: node scripts/browser-studio-expansion.mjs
      - name: Cross-method evidence, recipe replay and paired event studies
        env:
          ENSEMBLE_OUTPUT: test-results/ensemble
        run: node scripts/browser-ensemble.mjs
      - name: Desktop calendar atlas, birth precision and event search
        env:
          ATLAS_OUTPUT: test-results/atlas
        run: node scripts/browser-atlas.mjs
      - name: Interactive sky, calendar alignment and grounded interpretation
        env:
          SKY_OUTPUT: test-results/sky
        run: node scripts/browser-sky.mjs
      - name: Historical country records, source precision and assumed house geometry
        env:
          COUNTRY_OUTPUT: test-results/country-history
        run: node scripts/browser-country-history.mjs
      - name: Synchronized chart timeline, clock transitions and actual exports
        env:
          TIMELINE_OUTPUT: test-results/calendar-timeline
        run: node scripts/browser-calendar-timeline.mjs
      - name: Complete horizon, exports, cancellation and release integrity
        env:
          HORIZON_OUTPUT: test-results/horizon
        run: node scripts/browser-horizon.mjs
      - name: Newton chronology, complete year and historical research interactions
        env:
          NEWTON_OUTPUT: test-results/newton-chronology
        run: node scripts/browser-newton-chronology.mjs
      - name: Eschatology source graph, date precision and named readings
        env:
          ESCHATOLOGY_OUTPUT: test-results/eschatology-atlas
        run: node scripts/browser-eschatology-atlas.mjs
      - name: Date sliders, anchored details, local bookmarks and country contexts
        env:
          DATE_NAV_OUTPUT: test-results/date-wayfinding
        run: node scripts/browser-date-wayfinding.mjs
      - name: Celestial season bookmarks, phase icons and exact-time navigation
        env:
          CELESTIAL_OUTPUT: test-results/celestial-bookmarks
        run: node scripts/browser-celestial-bookmarks.mjs
      - name: Private birth reading, calendar comparison and offline exports
        env:
          BIRTH_READING_OUTPUT: test-results/birth-reading
        run: node scripts/browser-birth-reading.mjs

      - name: Site themes, keyboard access, contrast and preserved study state
        env:
          SITE_DESIGN_OUTPUT: test-results/site-design
          PUPPETEER_PKG: node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")" node scripts/browser-site-design.mjs
      - name: Neon planet surfaces, black drawing previews and portable paint servers
        env:
          NEON_CHART_OUTPUT: test-results/neon-charts
        run: node scripts/browser-neon-charts.mjs
      - name: Fetch pinned SkyLens integration fixture
        env:
          SKY_REVISION: 2b2aa089009db3ddedc2256a7a5456b402b23962
          SKY_LENS_ROOT: ${{ runner.temp }}/skylens-session
        run: |
          git init "$SKY_LENS_ROOT"
          git -C "$SKY_LENS_ROOT" remote add origin https://github.com/occult-kranti/skylens.git
          git -C "$SKY_LENS_ROOT" fetch --depth=1 origin "$SKY_REVISION"
          git -C "$SKY_LENS_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$SKY_LENS_ROOT" rev-parse HEAD)" = "$SKY_REVISION"
      - name: Verify observing sessions and explicit AI disclosure
        env:
          SKY_LENS_ROOT: ${{ runner.temp }}/skylens-session
        run: |
          node scripts/check-sky-handoff.mjs
          node scripts/browser-sessions.mjs
      - name: Package optional localhost companion without model weights or credentials
        run: python3 scripts/package-local-rag.py --output test-results/workbench-local-rag.zip
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stage tracked static files and release identity
        # git archive excludes ephemeral dependencies and local untracked files.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/desktop-astrology-workbench')
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          cp test-results/desktop-standalone-build/desktop-chart-studio.html _site/desktop-chart-studio.html
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, rmSync } from 'node:fs';
          for (const path of ['.github', 'tests', 'scripts', 'tools', 'test-results', 'node_modules', 'mcp', 'local-rag']) {
            rmSync('_site/' + path, { recursive: true, force: true });
          }
          writeFileSync('_site/.nojekyll', '');
          writeFileSync('_site/release.json', JSON.stringify({
            commit: process.env.RELEASE_SHA,
            generatedAt: new Date().toISOString(),
            validation: 'node-and-playwright',
            sourceMcpTools: JSON.parse(readFileSync('assets/data/mcp-catalogue.json', 'utf8')).tools.map(tool => tool.name).sort(),
          }, null, 2) + '\n');
          NODE
      - name: Build verified portable static edition
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/desktop-astrology-workbench')
        run: python3 scripts/package-offline.py --output _site/offline-workbench.zip

      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/desktop-astrology-workbench')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  horizon-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Brute-force and shared-context full-horizon equivalence
        run: node scripts/stress-horizon.mjs --output test-results/horizon-stress/receipt.json
      - name: Keep full-window stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-stress-evidence
          path: test-results/horizon-stress/
          retention-days: 14

  deploy:
    needs: [verify, mcp, horizon-stress]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/desktop-astrology-workbench' && inputs.deploy_feature_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Inspect Pages publication source
        # Updating this repository setting requires owner administration access:
        # both the integration and pages:write job received 403 on PUT. Existing
        # artifact deployment is authorized separately and still verified below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publication_source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if test "$publication_source" != workflow; then
            echo "::warning::Owner action: Settings > Pages > Source > GitHub Actions. Legacy branch builds remain enabled; this job deploys and verifies its tested artifact."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.PAGE_URL);
          if (base.protocol !== 'https:') throw new Error('Pages must use HTTPS for camera and sensors.');
          let verified = false;
          for (let attempt = 0; attempt < 15; attempt++) {
            try {
              const metadata = new URL('release.json', base);
              metadata.searchParams.set('release', process.env.RELEASE_SHA);
              const response = await fetch(metadata, { signal: AbortSignal.timeout(10000) });
              const release = await response.json();
              if (response.ok && release.commit === process.env.RELEASE_SHA) {
                const home = await fetch(base, { signal: AbortSignal.timeout(10000) });
                if (!home.ok) throw new Error('Published homepage is unavailable.');
                const desktop = await fetch(new URL('pages/desktop.html', base), { signal: AbortSignal.timeout(10000) });
                if (!desktop.ok || !(await desktop.text()).includes('desktop-workbench')) throw new Error('Published desktop workbench is unavailable.');
                const readingLab = await fetch(new URL('pages/reading-lab.html', base), { signal: AbortSignal.timeout(10000) });
                const readingLabHTML = await readingLab.text();
                if (!readingLab.ok || !readingLabHTML.includes('id="rl-app"') || !readingLabHTML.includes('reading-lab.js')) throw new Error('Published Reading Lab is unavailable.');
                const astrocartography = await fetch(new URL('pages/astrocartography.html', base), { signal: AbortSignal.timeout(10000) });
                const astrocartographyHTML = await astrocartography.text();
                if (!astrocartography.ok || !astrocartographyHTML.includes('id="ag-app"') || !astrocartographyHTML.includes('astrocartography.js')) throw new Error('Published Astrocartography atlas is unavailable.');
                const studio = await fetch(new URL('pages/studio.html', base), { signal: AbortSignal.timeout(10000) });
                const studioHTML = await studio.text();
                if (!studio.ok || !studioHTML.includes('Live Symbol Studio') || !studioHTML.includes('sessionJournal')) throw new Error('Published Studio/session journal is unavailable.');
                const setup = await fetch(new URL('pages/mcp.html', base), { signal: AbortSignal.timeout(10000) });
                if (!setup.ok || !(await setup.text()).includes('Connect MCP')) throw new Error('Published MCP connection page is unavailable.');
                const catalogueResponse = await fetch(new URL('assets/data/mcp-catalogue.json', base), { signal: AbortSignal.timeout(10000) });
                const catalogue = await catalogueResponse.json();
                const required = ['workbench_calendar_timeline_frame', 'workbench_country_history', 'workbench_horizon_scan', 'workbench_horizon_day', 'workbench_compare_moment', 'workbench_calendar_outlook', 'workbench_explain_guidance', 'workbench_calendar_atlas', 'workbench_sky_snapshot', 'workbench_sky_timeline', 'workbench_calendar_alignment', 'workbench_sky_interpretation', 'workbench_source_search', 'workbench_tool_guide', 'workbench_reading_lab', 'workbench_reading_examples', 'workbench_astrocartography', 'workbench_astrocartography_place'];
                const publishedNames = Array.isArray(catalogue.tools) ? catalogue.tools.map(tool => tool.name).sort() : [];
                if (!catalogueResponse.ok || catalogue.staticPageIsMcpServer !== false || !Array.isArray(release.sourceMcpTools) || JSON.stringify(publishedNames) !== JSON.stringify(release.sourceMcpTools) || !required.every(name => publishedNames.includes(name))) throw new Error('Published MCP catalogue is missing or does not match the verified release.');
                const comparison = await fetch(new URL('pages/calendar-compare.html', base), { signal: AbortSignal.timeout(10000) });
                if (!comparison.ok || !(await comparison.text()).includes('obs-form')) throw new Error('Published calendar comparison is unavailable.');
                verified = true;
                console.log('Verified Pages release ' + release.commit + ' at ' + base.href);
                break;
              }
            } catch (error) { console.log('Waiting for Pages publication: ' + error.message); }
            await new Promise(resolve => setTimeout(resolve, 4000));
          }
          if (!verified) throw new Error('Published release identity did not match the tested commit.');
          NODE
